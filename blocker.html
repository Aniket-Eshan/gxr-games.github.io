<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Supernova FX — Blocker</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
  <link rel="icon" href="icons8-star-64.png" type="image/x-icon">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Orbitron', sans-serif;
      color: #f4c430;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      background-attachment: fixed;
    }

    h1 {
      margin: 40px 0 20px;
      font-size: 2em;
    }

    .toggle {
      font-size: 1.5em;
      color: #00ffff;
      cursor: pointer;
      margin-top: 30px;
      user-select: none;
    }

    .block-section {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
      background-color: rgba(17, 17, 17, 0.6);
      backdrop-filter: blur(8px);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px #00ffff;
      border: 1px solid #00ffff;
    }

    .collapsed {
      display: none;
    }

    input[type="text"] {
      width: 80%;
      max-width: 600px;
      padding: 12px;
      font-size: 18px;
      border: 1px solid #00ffff;
      border-radius: 5px;
      outline: none;
      font-family: 'Orbitron', sans-serif;
      background-color: #111;
      color: #00ffff;
      text-align: center;
      margin-bottom: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: rgba(0, 255, 255, 0.2);
      color: #00ffff;
      font-family: 'Orbitron', sans-serif;
      border: 1px solid #00ffff;
      border-radius: 5px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 10px #00ffff;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: rgba(0, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <h1>🔓 Supernova FX Blocker</h1>

  <div class="toggle" onclick="toggleSection('basicBlocker', this)">▶ 🧱 Basic Blocker</div>
  <div id="basicBlocker" class="block-section">
    <input type="text" id="basicUrl" placeholder="Enter URL or name to block">
    <button onclick="launchBasic()">Block</button>
  </div>

  <div class="toggle" onclick="toggleSection('advancedBlocker', this)">▶ 🧪 Advanced Blocker</div>
  <div id="advancedBlocker" class="block-section collapsed">
    <input type="text" id="urlField" placeholder="Enter URL or name to block">
    <input type="text" id="pathField" placeholder="Enter path to block">
    <input type="text" id="classField" placeholder="Enter class name">
    <input type="text" id="userField" placeholder="Enter fake username">
    <button onclick="launchAdvanced()">Block</button>
  </div>

  <div class="toggle" onclick="toggleSection('spoofLinks', this)">▶ 🧨 Spoof Screens</div>
  <div id="spoofLinks" class="block-section collapsed">
    <button onclick="window.location.href='https://blocked.syd-1.linewize.net/closed_tab'">🗂️ Closed Tab</button>
    <button onclick="window.location.href='https://blocked.syd-1.linewize.net/locked'">🔒 Locked Screen</button>
  </div>

  <script>
    function toggleSection(id, toggleElement) {
      const section = document.getElementById(id);
      const isCollapsed = section.classList.contains('collapsed');
      section.classList.toggle('collapsed');
      toggleElement.textContent = (isCollapsed ? '▼' : '▶') + toggleElement.textContent.slice(1);
    }

    function launchBasic() {
      const input = document.getElementById('basicUrl').value.trim();
      if (!input) return;
      const encoded = encodeURIComponent(input);
      const spoof = `https://blocked.syd-1.linewize.net/blocked?url=${encoded}`;
      window.location.href = spoof;
    }

    function launchAdvanced() {
      const url = encodeURIComponent(document.getElementById('urlField').value.trim());
      const path = encodeURIComponent(document.getElementById('pathField').value.trim());
      const classname = encodeURIComponent(document.getElementById('classField').value.trim());
      const username = encodeURIComponent(document.getElementById('userField').value.trim());

      const spoof = `https://blocked.syd-1.linewize.net/blocked?url=${url}&deviceid=PHYS-SMIC-US-0000-0000&user=${username}&path=${path}&method=zoom_match&class_name=${classname}`;
      window.location.href = spoof;
    }
  </script>
</body>
</html>
