<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Supernova FX — Blocker</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
  <link rel="icon" href="icons8-star-64.png" type="image/x-icon">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000000;
      font-family: 'Orbitron', sans-serif;
      color: #f4c430;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    h1 {
      margin: 40px 0 20px;
      font-size: 2em;
    }

    h2 {
      font-size: 1.5em;
      color: #00ffff;
      cursor: pointer;
      margin-top: 30px;
    }

    section {
      width: 100%;
      max-width: 700px;
      display: none;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
      background-color: #111;
      padding: 20px;
      border-radius: 10px;
    }

    input[type="text"] {
      width: 80%;
      max-width: 600px;
      padding: 12px;
      font-size: 18px;
      border: 1px solid #00ffff;
      border-radius: 5px;
      outline: none;
      font-family: 'Orbitron', sans-serif;
      background-color: #111;
      color: #00ffff;
      text-align: center;
      margin-bottom: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #00ffff;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #00cccc;
    }

    .spoof-links {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1>🔓 Supernova FX Blocker</h1>

  <h2 onclick="toggleSection('basicBlocker')">▶ 🧱 Basic Blocker</h2>
  <section id="basicBlocker">
    <input type="text" id="basicUrl" placeholder="Enter URL or name to block">
    <button onclick="launchBasic()">Block</button>
  </section>

  <h2 onclick="toggleSection('advancedBlocker')">▶ 🧪 Advanced Blocker</h2>
  <section id="advancedBlocker">
    <input type="text" id="urlField" placeholder="Enter URL or name to block">
    <input type="text" id="pathField" placeholder="Enter path to block">
    <input type="text" id="classField" placeholder="Enter class name">
    <input type="text" id="userField" placeholder="Enter fake username">
    <button onclick="launchAdvanced()">Block</button>
  </section>

  <!-- Extra Spoof Links -->
  <div class="spoof-links">
    <button onclick="window.location.href='https://blocked.syd-1.linewize.net/closed_tab'">🗂️ Closed Tab</button>
    <button onclick="window.location.href='https://blocked.syd-1.linewize.net/locked'">🔒 Locked Screen</button>
  </div>

  <script>
    function toggleSection(id) {
      const section = document.getElementById(id);
      section.style.display = section.style.display === "flex" ? "none" : "flex";
    }

    function launchBasic() {
      const input = document.getElementById('basicUrl').value.trim();
      if (!input) return;
      const encoded = encodeURIComponent(input);
      const spoof = `https://blocked.syd-1.linewize.net/blocked?url=${encoded}`;
      window.location.href = spoof;
    }

    function launchAdvanced() {
      const url = encodeURIComponent(document.getElementById('urlField').value.trim());
      const path = encodeURIComponent(document.getElementById('pathField').value.trim());
      const classname = encodeURIComponent(document.getElementById('classField').value.trim());
      const username = encodeURIComponent(document.getElementById('userField').value.trim());

      const spoof = `https://blocked.syd-1.linewize.net/blocked?url=${url}&deviceid=PHYS-SMIC-US-0000-0000&user=${username}&path=${path}&method=zoom_match&class_name=${classname}`;
      window.location.href = spoof;
    }
  </script>
</body>
</html>
