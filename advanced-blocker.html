<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Supernova FX — Blocker</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
  <link rel="icon" href="icons8-star-64.png" type="image/x-icon">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000000;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f4c430;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2em;
    }

    input[type="text"] {
      width: 60%;
      max-width: 600px;
      padding: 12px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      outline: none;
      font-family: 'Orbitron', sans-serif;
      background-color: #111;
      color: #00ffff;
      text-align: center;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #00ffff;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #00cccc;
    }
  </style>
</head>
<body>
  <h1>🔓 Supernova FX Blocker</h1>
  <input type="text" id="urlInput" placeholder="Enter URL or name to block">
  <input type="text" id="urlInput" placeholder="Enter path to block">
  <input type="text" id="urlInput" placeholder="Enter class name">
  <input type="text" id="urlInput" placeholder="Enter fake username">
  <button onclick="launch()">Block</button>

  <script>
    function launch() {
      const input = document.getElementById('urlInput').value.trim();
      if (!input) return;

      const url = encodeURIComponent(input);
      const path = encodeURIComponent(input);
      const classname = encodeURIComponent(input);
      const username = encodeURIComponent(input);
      const proxy1 = "https://blocked.syd-1.linewize.net/blocked?url=";
      const proxy2 = "&deviceid=PHYS-SMIC-US-0000-0000&user=";
      const proxy3 = "&path=";
      const proxy4 = "&method=zoom_match&class_name=";
      window.location.href = proxy1 + url + proxy2 + username + proxy3 + path + proxy4 + classname;
    }
  </script>
</body>
</html>
