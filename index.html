    <script>
                                   
    function launchStealth(url) {
      const win = window.open('about:blank', '_blank');
      const doc = win.document;
      doc.write(`
        <html>
          <head>
            <title>Supernova FX Games</title>
            <style>
              html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                background-color: #000;
              }
              iframe {
                border: none;
                width: 100%;
                height: 100%;
              }
            </style>
          </head>
          <body>
            <iframe src="${url}" allowfullscreen></iframe>
          </body>
        </html>
      `);
      doc.close();
    }
