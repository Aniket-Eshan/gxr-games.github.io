    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Orbitron', sans-serif;
      color: #f4c430;
      overflow-x: hidden;
    }

    body {
      background: url('design render GIF by xponentialdesign.gif') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 20px;
    }

    img.header {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-bottom: 1px solid #00ffff;
    }

    h1 {
      margin-top: 20px;
      font-size: 2.5em;
      text-align: center;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      width: 90%;
      max-width: 1200px;
      margin: 40px auto;
    }

    button {
      padding: 10px 20px;
      background: rgba(0, 255, 255, 0.2);
      color: #00ffff;
      font-family: 'Orbitron', sans-serif;
      border: 1px solid #00ffff;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 10px #00ffff;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: rgba(0, 255, 255, 0.4);
    }
    .gx-button {
      margin: 10px 0;
      padding: 12px 30px;
      font-size: 1.1em;
      background-color: rgba(255, 255, 255, 0.1);
      color: #f4c430;
      font-family: 'Orbitron', sans-serif;
      border: 1px solid #f4c430;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 15px #f4c430;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .gx-button:hover {
        background-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 25px #f4c430;
    }

  </style>

  <script>
    function launchStealth(url) {
      const win = window.open('about:blank', '_blank');
      const doc = win.document;
      doc.write(`
        <html>
          <head>
            <title>Supernova FX Games</title>
            <style>
              html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                background-color: #000;
              }
              iframe {
                border: none;
                width: 100%;
                height: 100%;
              }
            </style>
          </head>
          <body>
            <iframe src="${url}" allowfullscreen></iframe>
          </body>
        </html>
      `);
      doc.close();
    }
  </script>
